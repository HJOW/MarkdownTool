<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Markdown Tool</title>
    <link rel="stylesheet" href="css/fonts.css"/>
    <meta name="color-scheme" content="light dark"/>
    <link rel="stylesheet" href="dist/mdtool.css"/>
    <link rel="stylesheet" href="css/mdtool.css"/>
    <script type="module" src="dist/mdtool.js"></script>
</head>
<body>
    <header class="toolbar top-toolbar">
        <div class="brand"><span class="brand-mark" aria-hidden="true">M↓</span><strong>Markdown Tool</strong></div>
        <div class="file-actions" role="group" aria-label="File actions" data-i18n-aria-label="fileActions">
            <button id="new-button" type="button" data-i18n="newDocument">New</button>
            <button id="open-button" type="button" data-i18n="openFile">Open file</button>
            <button id="save-button" type="button" class="primary" data-i18n="save">Save</button>
            <button id="print-button" type="button" data-i18n="print">Print</button>
        </div>
        <fieldset class="mode-switch">
            <legend class="visually-hidden" data-i18n="screenMode">View mode</legend>
            <label><input type="radio" name="mode" value="edit" checked/><span data-i18n="edit">Edit</span></label>
            <label><input type="radio" name="mode" value="view"/><span data-i18n="view">Preview</span></label>
            <label><input type="radio" name="mode" value="split"/><span data-i18n="split">Side by side</span></label>
        </fieldset>
    </header>
    <div class="document-bar">
        <span class="document-name" id="filename">notitle</span>
        <span id="dirty-indicator" class="dirty-indicator" hidden data-i18n="modified">Modified</span>
        <span id="message" role="status" aria-live="polite"></span>
    </div>
    <main id="workspace" class="workspace" data-mode="edit">
        <section id="source-panel" class="panel source-panel" aria-labelledby="source-heading">
            <div class="panel-heading"><h1 id="source-heading">Markdown</h1><span id="source-state" data-i18n="editable">Editable</span></div>
            <div class="editor-area"><div id="editor" class="source-editor"></div></div>
        </section>
        <section id="preview-panel" class="panel preview-panel" aria-labelledby="preview-heading" hidden>
            <div class="panel-heading"><h2 id="preview-heading" data-i18n="previewHeading">HTML preview</h2><span data-i18n="readOnly">Read only</span></div>
            <iframe id="preview" title="Markdown document preview" data-i18n-title="previewTitle" sandbox="allow-same-origin allow-popups allow-popups-to-escape-sandbox" referrerpolicy="no-referrer"></iframe>
        </section>
    </main>
    <footer class="toolbar bottom-toolbar">
        <div class="document-stats" aria-label="Document information" data-i18n-aria-label="documentInfo">
            <span id="line-count">1 line</span><span id="byte-count">0 B</span><span>UTF-8</span>
        </div>
        <div class="display-actions">
            <label class="language-control" for="language-select"><span data-i18n="language">Language</span>
                <select id="language-select">
                    <option value="en">English</option>
                    <option value="ko">한국어</option>
                </select>
            </label>
            <button id="theme-button" type="button" class="theme-button" aria-pressed="false">Dark mode</button>
        </div>
    </footer>
    <input id="file-input" type="file" accept=".md,.markdown,text/markdown" hidden/>
    <dialog id="save-dialog" aria-labelledby="save-title" aria-describedby="save-description">
        <h2 id="save-title" data-i18n="saveTitle">Save document</h2>
        <p id="save-description" data-i18n="saveDescription">Choose a download format and its options.</p>
        <div class="save-options">
            <label class="save-option">
                <input type="radio" name="save-format" value="md" checked/>
                <span><strong>Markdown <small>.md</small></strong><small data-i18n="markdownSaveDescription">Save the source and continue editing</small></span>
            </label>
            <label class="save-option">
                <input type="radio" name="save-format" value="html"/>
                <span><strong>HTML <small>.html</small></strong><small data-i18n="htmlSaveDescription">Save as a formatted web document</small></span>
            </label>
            <label class="save-option">
                <input type="radio" name="save-format" value="pdf"/>
                <span><strong>PDF <small>.pdf</small></strong><small data-i18n="pdfSaveDescription">Save as an A4 document for printing and sharing</small></span>
            </label>
        </div>
        <label id="font-option" hidden><input id="embed-fonts" type="checkbox" checked/> <span><strong data-i18n="embedFonts">Embed fonts</strong><small data-i18n="embedFontsDescription">Clear this option to load fonts from a CDN.</small></span></label>
        <fieldset id="pdf-theme-option" hidden>
            <legend data-i18n="pdfTheme">PDF theme</legend>
            <p data-i18n="pdfThemeDescription">This choice only affects the saved PDF, not the current screen or preview.</p>
            <div class="pdf-theme-options">
                <label><input id="pdf-theme-light" type="radio" name="pdf-theme" value="light" checked/> <span data-i18n="lightTheme">Light theme</span></label>
                <label><input id="pdf-theme-dark" type="radio" name="pdf-theme" value="dark"/> <span data-i18n="darkTheme">Dark theme</span></label>
            </div>
        </fieldset>
        <p id="save-message" role="status" aria-live="polite"></p>
        <div class="dialog-actions">
            <form method="dialog"><button id="cancel-save" type="submit" data-i18n="cancel">Cancel</button></form>
            <button id="download-button" type="button" class="primary" data-i18n="downloadFile">Download file</button>
        </div>
    </dialog>
    <noscript data-i18n="javascriptRequired">Enable JavaScript in your browser to use this tool.</noscript>
</body>
</html>
